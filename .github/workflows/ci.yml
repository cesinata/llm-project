name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,app]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Build sample warehouse (dbt models + data tests)
        run: |
          crashsql load --sample
          crashsql build
      - name: Gold SQL runs
        run: crashsql eval --gold-only
      - name: Unit tests
        run: pytest -q
