crashsql:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      path: "{{ env_var('CRASHSQL_DB', '../data/warehouse.duckdb') }}"
      threads: 4

    # Optional: run the same models on a Snowflake trial account.
    # Requires `pip install -e ".[snowflake]"` and the env vars below.
    # The raw table must first be loaded into <database>.raw.crashes (see README).
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      user: "{{ env_var('SNOWFLAKE_USER', '') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'ACCOUNTADMIN') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'CRASHSQL') }}"
      schema: marts
      threads: 4
