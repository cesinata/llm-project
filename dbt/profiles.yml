crashsql:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      path: "{{ env_var('CRASHSQL_DB', '../data/warehouse.duckdb') }}"
      threads: 4

    # Optional: run the same models on a Snowflake trial account.
    # Requires `pip install -e ".[snowflake]"` and the env vars below.
    # The raw table must first be loaded into <database>.raw.crashes (see README).
    # Key-pair auth works with MFA-enforced accounts; it takes precedence over the password.
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      # Optional. Set this when key-pair login reports "JWT token is invalid":
      # the token must carry the account locator, while the connection uses the org host.
      host: "{{ env_var('SNOWFLAKE_HOST', '') }}"
      user: "{{ env_var('SNOWFLAKE_USER', '') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'ACCOUNTADMIN') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'CRASHSQL') }}"
      schema: marts
      threads: 4
